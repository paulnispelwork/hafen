# Builds the signed APK on GitHub and attaches it to a release when that release is published.
# Needs two repository secrets: HAFEN_KEYSTORE_B64 (the .jks, base64) and HAFEN_SIGNING_PROPS
# (storePassword, keyAlias, keyPassword as a .properties file).
name: Release APK

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Signing
        env:
          KEYSTORE_B64: ${{ secrets.HAFEN_KEYSTORE_B64 }}
          SIGNING_PROPS: ${{ secrets.HAFEN_SIGNING_PROPS }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/hafen.jks"
          printf '%s\n' "$SIGNING_PROPS" > "$RUNNER_TEMP/signing.properties"
          echo "storeFile=$RUNNER_TEMP/hafen.jks" >> "$RUNNER_TEMP/signing.properties"
          echo "hafen.signing=$RUNNER_TEMP/signing.properties" > keystore.local

      - name: Test and build
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleRelease

      - name: Same key as earlier releases (otherwise phones can't update)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          gh release download v0.9.1 --pattern '*.apk' --dir "$RUNNER_TEMP/ref"
          NEW=$("$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk | grep "SHA-256")
          OLD=$("$APKSIGNER" verify --print-certs "$RUNNER_TEMP"/ref/*.apk | grep "SHA-256")
          echo "$NEW"; [ "$NEW" = "$OLD" ]

      - name: Attach to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk "Hafen-${TAG#v}.apk"
          gh release upload "$TAG" "Hafen-${TAG#v}.apk" --clobber

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: hafen-apk
          path: app/build/outputs/apk/release/app-release.apk
